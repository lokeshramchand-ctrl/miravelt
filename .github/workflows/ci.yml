name: CI

on:
  push:
    branches: ["main", "master", "frontend"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main", "master", "frontend"]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Secret scanning ---
  # Runs first and independently of everything else: if a credential was
  # accidentally committed, we want that signal even if lint/tests are broken
  # for an unrelated reason, and there's no reason to wait on them for it.
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Lint ---
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.8  # keep in step with .pre-commit-config.yaml
      - name: Run ruff check
        run: ruff check .

  # --- Dependency vulnerability scan ---
  dependency-scan:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt
      - name: Audit training-only dependencies
        run: pip-audit -r requirements-training.txt
        continue-on-error: true  # informational: this stack (torch/transformers/etc) is never deployed

  # --- Tests ---
  # Runs against a real MongoDB service container, matching how test_api.py's
  # module-scoped `client` fixture actually exercises the app's lifespan
  # (real DB connections, nothing mocked) - see docs/15-testing.md.
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Statement upload now dispatches via Celery (tasks/statement_tasks.py)
      # instead of in-process BackgroundTasks, so POST /statements/upload
      # needs a reachable broker to even return 202 - test_api.py's
      # processed_statement fixture exercises that real dispatch.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGODB_URI: "mongodb://localhost:27017/?authSource=admin"
      MONGODB_DB_NAME: "miravelt_ci"
      MILVUS_URI: "http://localhost:19530"
      REDIS_URI: "redis://localhost:6379/0"
      EMBED_MODEL: "nomic-embed-text"
      LLM_MODEL: "llama3"
      MIRAVELT_API_KEY: "ci_test_key"
      JWT_SECRET_KEY: "ci_test_jwt_signing_key_at_least_32_characters_long"
      LOG_LEVEL: "WARNING"
      # ENVIRONMENT defaults to "production", which turns on HTTPS
      # enforcement - and TestClient speaks plain http://, so every request
      # was rejected with 400 https_required before reaching a route.
      ENFORCE_HTTPS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run test suite
        run: pytest test_api.py tests -v

  # --- Docs must not name files that no longer exist (PROJECT_AUDIT.md E9) ---
  docs-check:
    name: Docs reference check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py

  # --- Admin dashboard and landing page (PROJECT_AUDIT.md F22) ---
  web:
    name: Web (${{ matrix.app }} lint + build)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin-dashboard, landing-page]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci || npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          BACKEND_URL: http://localhost:8000
          MIRAVELT_API_KEY: ci
          MIRAVELT_ADMIN_KEY: ci
          SESSION_SECRET: ci_session_secret_at_least_32_characters_long

  # --- Frontend (React Native / Expo) ---
  frontend:
    name: Frontend (tsc + jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type-check
        run: npm run typecheck
      - name: Run test suite
        run: npm test

  # --- Docker build + image hardening/vulnerability checks ---
  docker:
    name: Docker build, lint & scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Build image
        run: docker build -t miravelt-backend:ci .

      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: miravelt-backend:ci
          severity: "CRITICAL,HIGH"
          exit-code: "0"  # informational for now - flip to "1" to hard-fail the build once triaged
          format: "table"

  # --- Environment promotion ---
  # Coolify (docker-compose_production.yaml's external `coolify` network)
  # redeploys on a webhook hit, so these jobs just gate *when* that webhook
  # fires rather than building/pushing anything themselves:
  #   main branch, all checks green  -> staging, automatically
  #   a `vX.Y.Z` tag, all checks green -> production, gated by the
  #   "production" GitHub Environment's required reviewers (configure once
  #   in Settings > Environments - not something a workflow file can set).
  # Both no-op (not fail) if their webhook secret isn't configured yet, same
  # "degrade gracefully, don't hard-depend" posture as REDIS_URI elsewhere
  # in this repo.
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: [secret-scan, lint, dependency-scan, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: staging
    steps:
      - name: Trigger staging deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "COOLIFY_STAGING_WEBHOOK_URL not set - skipping deploy trigger."
            echo "Configure it under Settings > Environments > staging to enable auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK_URL"

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [secret-scan, lint, dependency-scan, test, docker]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    steps:
      - name: Trigger production deploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_PRODUCTION_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "COOLIFY_PRODUCTION_WEBHOOK_URL not set - skipping deploy trigger."
            echo "Configure it under Settings > Environments > production to enable tag-based deploy."
            exit 0
          fi
          curl -fsS -X POST "$WEBHOOK_URL"
