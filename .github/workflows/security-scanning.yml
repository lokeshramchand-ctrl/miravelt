name: Security Scanning

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write

jobs:
  # CodeQL Static Analysis Security Testing (SAST)
  codeql:
    name: CodeQL SAST Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # Semgrep Static Analysis
  semgrep:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    # returntocorp/semgrep-action is deprecated and stopped writing the SARIF
    # file; the official image's CLI is the supported way to run it.
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config p/security-audit --sarif --output semgrep.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif

  # Trivy Container Image Scanning
  trivy-scan:
    name: Trivy Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t miravelt:scan .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: miravelt:scan
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: "trivy"

  # Snyk Vulnerability Scanning
  snyk-dependencies:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Needs a SNYK_TOKEN repository secret; without one the scan can only
      # fail on authentication, so it is skipped instead of failing the run.
      - name: Skip (no SNYK_TOKEN secret configured)
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::Snyk skipped - add a SNYK_TOKEN repository secret to enable it."

      - name: Run Snyk scan
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/python-3.12@master
        with:
          args: --severity-threshold=high

  # Bandit Security Issues Finder
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: bandit -r . -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # Safety - Python dependency vulnerability checker
  safety-check:
    name: Safety Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Safety
        run: pip install safety

      - name: Run Safety check on production dependencies
        run: safety check -r requirements.txt --json

      - name: Run Safety check on training dependencies (informational)
        run: safety check -r requirements-training.txt --json
        continue-on-error: true

  # Gitleaks Secret Scanning (runs per commit)
  gitleaks-full:
    name: Gitleaks Full Repository Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks full scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  # TruffleHog Secret Detection
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: pip install truffleHog

      - name: Run TruffleHog scan
        run: trufflehog filesystem . --json > trufflehog-results.json
        continue-on-error: true

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-results
          path: trufflehog-results.json

  # OWASP Dependency Check
  owasp-depcheck:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "miravelt"
          path: "."
          format: "SARIF"
          out: "reports"
          # --enableExperimental turns on the Python analyzers. The previous
          # --enablePackageList/--enablePyknock are not dependency-check
          # options, so the tool printed its usage and wrote no report.
          args: >
            --enableExperimental

      - name: Upload OWASP results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        with:
          sarif_file: reports/dependency-check-report.sarif
