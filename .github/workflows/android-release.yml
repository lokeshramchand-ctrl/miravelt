name: Android release APK

# Manual only: builds a signed release APK of frontend/ and uploads it as a
# short-lived artifact. Needs repo secrets: ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
# MIRAVELT_API_KEY (the client key the backend expects in X-Miravelt-API-Key).
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Backend base URL baked in as the production default"
        required: false
        default: "https://miravelt.deploy-ui.lokeshrc.me/"

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      EXPO_PUBLIC_MIRAVELT_API_KEY: ${{ secrets.MIRAVELT_API_KEY }}
      EXPO_PUBLIC_MIRAVELT_API_BASE_URL: ${{ inputs.api_base_url }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Refuse to build with the public placeholder key
        run: |
          if [ -z "$EXPO_PUBLIC_MIRAVELT_API_KEY" ] || [ "$EXPO_PUBLIC_MIRAVELT_API_KEY" = "miravelt_test_key_123" ]; then
            echo "MIRAVELT_API_KEY secret is missing or is the public placeholder" >&2; exit 1
          fi

      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Restore release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          test -s "$RUNNER_TEMP/release.p12"

      - name: Build signed release APK
        working-directory: frontend/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.p12" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify signature and print fingerprint
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "Signer #1 certificate (DN|SHA-256)"
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|sdkVersion|application-label:"
          ls -l "$APK"
          cp "$APK" "$RUNNER_TEMP/miravelt-release.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: miravelt-release-apk
          path: ${{ runner.temp }}/miravelt-release.apk
          retention-days: 3
          if-no-files-found: error
