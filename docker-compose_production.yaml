services:
  miravelt-backend:
    build: .
    container_name: miravelt-backend
    # No bind mount here (unlike docker-compose_local.yaml): production must
    # run exactly what was built into the image, not whatever happens to be
    # on the host filesystem at deploy time - a bind mount here would have
    # silently defeated the reproducibility a container image is supposed to
    # guarantee, and would additionally have exposed the host's .env file
    # inside the container's filesystem.
    environment:
      # All values below are supplied by a docker-compose ".env" file or the
      # host/CI secret store at deploy time - never hardcode credentials here.
      # Variable names must match core/config.py's Settings fields exactly.
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-miravelt}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - OLLAMA_URI=${OLLAMA_URI:-}
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - MIRAVELT_API_KEY=${MIRAVELT_API_KEY:?MIRAVELT_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - ENFORCE_HTTPS=${ENFORCE_HTTPS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Trust X-Forwarded-For only from the proxy (Traefik) network so per-client
      # rate limits work. Never "*": clients could spoof their own bucket.
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Required (core/config.py) - statement upload dispatches via Celery
      # (tasks/statement_tasks.py), which needs a reachable broker, so this
      # is no longer just a caching/rate-limiting nice-to-have. Point it at
      # a managed/self-hosted Redis, same pattern as MONGODB_URI/MILVUS_URI
      # above (no Redis container is started by this file - production
      # points at externally managed infrastructure, not a compose-local
      # one, same as Mongo/Milvus/Ollama).
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set}
    # Traefik (Coolify proxy) reaches the app over the shared `coolify` network;
    # no host port is published.
    expose:
      - "8000"
    restart: always
    networks:
      - coolify
    # Read-only root filesystem with tmpfs mounts for writable paths
    # (FastAPI, Python logging, and temporary files). This prevents any
    # compromise from persisting or writing to arbitrary locations on disk.
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    # Defense in depth for a process that's already running as a non-root
    # user (see Dockerfile): even if the app or a dependency were compromised,
    # it can't escalate privileges or exercise Linux capabilities it has no
    # legitimate use for.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounds how much of the host's resources a single runaway request (e.g.
    # someone hammering POST /v1/pipelines/clustering/run) can consume.
    # Tune these against real measured usage before relying on them in a high
    # -traffic deployment - they're deliberately generous starting defaults,
    # not a tuned production ceiling. Note: `deploy.resources` is honored by
    # Docker Compose V2 (the `docker compose` CLI) for plain `up`, but is
    # Swarm-only under the legacy standalone `docker-compose` v1 binary - if
    # you're still on v1, pass --memory/--cpus to `docker run` instead, or
    # upgrade to Compose V2.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  # ---- Celery workers + beat (tasks/celery_app.py) ----
  # Same image as miravelt-backend, different command/queue. Three services,
  # not one worker handling everything, so load on one never delays another:
  #   - miravelt-celery-worker: scheduled batch pipelines
  #     (routers/pipelines.py) + the retraining executor
  #     (feedback/retraining_queue.py), queue "celery" (Celery's default).
  #   - miravelt-celery-worker-statements: statement processing
  #     (tasks/statement_tasks.py), queue "statements" - this is now on the
  #     critical path for every statement upload (routers/statements.py
  #     dispatches to it instead of in-process BackgroundTasks), not an
  #     optional extra. Tune STATEMENT_WORKER_CONCURRENCY against your
  #     actual Ollama throughput (scripts/stress_test.py) before trusting a
  #     number - a single GPU-backed Ollama instance is the real ceiling,
  #     not this worker.
  #   - miravelt-celery-beat: the one scheduler (ARCHITECTURE.md §6/§8) -
  #     never run more than one replica of this service, or every
  #     scheduled job fires once per replica.
  miravelt-celery-worker:
    build: .
    container_name: miravelt-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2 -Q celery
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-miravelt}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - OLLAMA_URI=${OLLAMA_URI:-}
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - MIRAVELT_API_KEY=${MIRAVELT_API_KEY:?MIRAVELT_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set to run the Celery worker/beat services}
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

  miravelt-celery-worker-statements:
    build: .
    container_name: miravelt-celery-worker-statements
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=${STATEMENT_WORKER_CONCURRENCY:-2} -Q statements
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-miravelt}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - OLLAMA_URI=${OLLAMA_URI:-}
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - MIRAVELT_API_KEY=${MIRAVELT_API_KEY:?MIRAVELT_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set}
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Larger than the pipeline worker: this is on the critical path for
    # every statement upload and does the PDF parsing + Ollama insight call
    # per job. Still a starting default - tune against real load.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  miravelt-celery-beat:
    build: .
    container_name: miravelt-celery-beat
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-miravelt}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - MIRAVELT_API_KEY=${MIRAVELT_API_KEY:?MIRAVELT_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set to run the Celery worker/beat services}
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # beat itself just schedules - it never touches Mongo/Milvus directly
    # (the worker does), so it gets the smallest reservation of the three.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 128m

  # ---- Redis (optional, commented out by default) ----
  # Same posture as Mongo/Milvus/Ollama: this file assumes Redis is already
  # running somewhere externally-managed, with REDIS_URI pointed at it - see
  # the comment on miravelt-backend's REDIS_URI above. If you don't have one
  # yet and want this compose file to run it instead, uncomment this block
  # and set REDIS_URI=redis://redis:6379/0 in your .env. Lightweight enough
  # (one container + one volume) that running it here is a reasonable
  # default if you have no other opinion on where Redis should live.
  # redis:
  #   image: redis:7-alpine
  #   container_name: miravelt-redis
  #   restart: always
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - coolify
  #   security_opt:
  #     - no-new-privileges:true
  #   cap_drop:
  #     - ALL
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "0.5"
  #         memory: 256m
  #       reservations:
  #         cpus: "0.1"
  #         memory: 64m

networks:
  coolify:
    external: true

# Uncomment alongside the redis service block above.
# volumes:
#   redis_data:
