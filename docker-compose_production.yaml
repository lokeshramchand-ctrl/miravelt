services:
  auvren-backend:
    build: .
    container_name: auvren-backend
    # No bind mount here (unlike docker-compose_local.yaml): production must
    # run exactly what was built into the image, not whatever happens to be
    # on the host filesystem at deploy time - a bind mount here would have
    # silently defeated the reproducibility a container image is supposed to
    # guarantee, and would additionally have exposed the host's .env file
    # inside the container's filesystem.
    environment:
      # All values below are supplied by a docker-compose ".env" file or the
      # host/CI secret store at deploy time - never hardcode credentials here.
      # Variable names must match core/config.py's Settings fields exactly.
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-auvren}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - OLLAMA_URI=${OLLAMA_URI:-}
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - AUVREN_API_KEY=${AUVREN_API_KEY:?AUVREN_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Optional, same as every other dependency in this file - an empty
      # value just leaves caching/distributed rate limiting disabled (see
      # core/config.py). Required for the auvren-celery-worker/-beat services
      # below to do anything; point it at a managed/self-hosted Redis, same
      # pattern as MONGODB_URI/MILVUS_URI above (no Redis container is
      # started by this file - production points at externally managed
      # infrastructure, not a compose-local one, same as Mongo/Milvus/Ollama).
      - REDIS_URI=${REDIS_URI:-}
    ports:
      - "9850:8000"
    restart: always
    networks:
      - coolify
    # Read-only root filesystem with tmpfs mounts for writable paths
    # (FastAPI, Python logging, and temporary files). This prevents any
    # compromise from persisting or writing to arbitrary locations on disk.
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    # Defense in depth for a process that's already running as a non-root
    # user (see Dockerfile): even if the app or a dependency were compromised,
    # it can't escalate privileges or exercise Linux capabilities it has no
    # legitimate use for.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounds how much of the host's resources a single runaway request (e.g.
    # someone hammering POST /v1/pipelines/clustering/run) can consume.
    # Tune these against real measured usage before relying on them in a high
    # -traffic deployment - they're deliberately generous starting defaults,
    # not a tuned production ceiling. Note: `deploy.resources` is honored by
    # Docker Compose V2 (the `docker compose` CLI) for plain `up`, but is
    # Swarm-only under the legacy standalone `docker-compose` v1 binary - if
    # you're still on v1, pass --memory/--cpus to `docker run` instead, or
    # upgrade to Compose V2.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  # ---- Celery worker + beat (tasks/celery_app.py) ----
  # Same image as auvren-backend, different command - these run the
  # scheduled batch pipelines (routers/pipelines.py) and the retraining
  # executor (feedback/retraining_queue.py) instead of serving HTTP. Both
  # are no-ops if REDIS_URI is left unset: `celery beat` will idle with an
  # unreachable broker and `celery worker` will just never receive a task,
  # neither crash-loops the deployment, but nothing runs either - this is
  # meaningful infrastructure to actually get automatic scheduling, not a
  # decoration. Omit these two services entirely if you don't want a
  # scheduler running yet.
  auvren-celery-worker:
    build: .
    container_name: auvren-celery-worker
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-auvren}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - OLLAMA_URI=${OLLAMA_URI:-}
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - AUVREN_API_KEY=${AUVREN_API_KEY:?AUVREN_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set to run the Celery worker/beat services}
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

  auvren-celery-beat:
    build: .
    container_name: auvren-celery-beat
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-auvren}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - AUVREN_API_KEY=${AUVREN_API_KEY:?AUVREN_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set to run the Celery worker/beat services}
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # beat itself just schedules - it never touches Mongo/Milvus directly
    # (the worker does), so it gets the smallest reservation of the three.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 128m

networks:
  coolify:
    external: true
