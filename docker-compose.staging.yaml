services:
  miravelt-backend:
    build: .
    container_name: miravelt-backend-staging
    # No bind mount, same reasoning as docker-compose_production.yaml:
    # staging must run the image that was actually built from the branch
    # under test, not whatever's on the host filesystem.
    environment:
      # Staging must point at its OWN MongoDB/Milvus/Redis instances and its
      # own MIRAVELT_API_KEY/JWT_SECRET_KEY — never the production values, and
      # never production's databases. See docker-compose_production.yaml for
      # why (a leaked staging credential must not be a production incident).
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-miravelt_staging}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - OLLAMA_URI=${OLLAMA_URI:-}
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - MIRAVELT_API_KEY=${MIRAVELT_API_KEY:?MIRAVELT_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
      # Fixed, not sourced from the environment file: this is what makes the
      # deployment staging rather than production (enables HTTPSEnforcement-
      # Middleware same as prod — see app.py — while keeping the two
      # deployments visibly distinct in logs/metrics).
      - ENVIRONMENT=staging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REDIS_URI=${REDIS_URI:-}
    ports:
      # Deliberately different from production's 9850, so both can run on
      # the same host/reverse-proxy if needed without colliding.
      - "9851:8000"
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Lower than production's — staging never needs to absorb real user
    # traffic, only exercise a real deployment path before promotion.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m

  # ---- Celery worker + beat (tasks/celery_app.py) ----
  # Same rationale as docker-compose_production.yaml: no-ops if REDIS_URI is
  # unset, omit these two services entirely if staging doesn't need the
  # scheduled batch pipelines exercised.
  miravelt-celery-worker:
    build: .
    container_name: miravelt-celery-worker-staging
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=1
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-miravelt_staging}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - OLLAMA_URI=${OLLAMA_URI:-}
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - MIRAVELT_API_KEY=${MIRAVELT_API_KEY:?MIRAVELT_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - ENVIRONMENT=staging
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set to run the Celery worker/beat services}
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m

  miravelt-celery-beat:
    build: .
    container_name: miravelt-celery-beat-staging
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      - MONGODB_URI=${MONGODB_URI:?MONGODB_URI must be set}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-miravelt_staging}
      - MILVUS_URI=${MILVUS_URI:?MILVUS_URI must be set}
      - EMBED_MODEL=${EMBED_MODEL:?EMBED_MODEL must be set}
      - LLM_MODEL=${LLM_MODEL:?LLM_MODEL must be set}
      - MIRAVELT_API_KEY=${MIRAVELT_API_KEY:?MIRAVELT_API_KEY must be set}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      - ENVIRONMENT=staging
      - REDIS_URI=${REDIS_URI:?REDIS_URI must be set to run the Celery worker/beat services}
    restart: always
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
      - /run
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 128m

networks:
  coolify:
    external: true
